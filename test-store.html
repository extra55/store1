                    '<button class="btn-qty btn-plus" style="width:40px; height:40px; font-size:20px;" onclick="changeQty(' + safeKeyAttr + ', 1)">+</button>';
        } else {
            html += '<button class="btn-qty btn-plus" style="height:42px; font-size:15px;" onclick="changeQty(' + safeKeyAttr + ', 1)">+ إضافة للسلة</button>';
        }
        html += '</div>';

        html += '<button onclick="buyNowProduct(' + safeKeyAttr + ')" style="width: 100%; padding: 12px; background: #16a34a; color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25); transition: all 0.2s ease;">⚡ شراء الآن</button>';
        html += '<button onclick="openShopPage()" style="width: 100%; padding: 12px; background: #0f172a; color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25); transition: all 0.2s ease;">🏠 الصفحة الرئيسية</button>';
        html += '</div>';
        
        box.innerHTML = html;
    }

    function buyNowProduct(id) {
        var key = String(id);
        var baseId = getBaseProductIdFromCartKey(key);
        var p = getProductById(baseId);
        if (isProductOutOfStock(p) || isAllVariantsOutOfStock(p)) {
            alert('عذراً، نفذت كمية هذا المنتج حالياً.');
            return;
        }
        var currentQty = cart[key] || 0;
        if (currentQty <= 0) {
            cart[key] = 1;
            saveCartToStorage();
            updateBadge();
        }
        openCartPage();
    }

    var addCartToastTimer = null;
    function showAddToCartToast(p, key) {
        var existing = document.getElementById("addToCartToast");
        if (existing) existing.remove();
        if (addCartToastTimer) clearTimeout(addCartToastTimer);

        var variantText = getVariantTextFromCartKey(key);
        var msgText = "";

        if (variantText) {
            var groupName = (p && Array.isArray(p.variants) && p.variants.length === 1 && p.variants[0].name)
                ? p.variants[0].name
                : "";
            if (groupName) {
                msgText = "✅ أُضيف (" + variantText + ") — يمكنك إضافة " + groupName + " الآخر";
            } else {
                msgText = "✅ أُضيف (" + variantText + ") — يمكنك إضافة اختيار آخر";
            }
        } else {
            msgText = "✅ تمت الإضافة إلى السلة";
        }

        var toast = document.createElement("div");
        toast.id = "addToCartToast";
        toast.style.cssText = "position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:rgba(15,23,42,0.96); color:#ffffff; border:1px solid #16a34a; padding:8px 12px; border-radius:12px; font-size:11.5px; font-weight:700; z-index:999999; box-shadow:0 4px 16px rgba(0,0,0,0.28); display:flex; align-items:center; justify-content:space-between; gap:10px; width:92vw; max-width:440px; line-height:1.35; direction:rtl;";

        var textSpan = document.createElement("span");
        textSpan.innerText = msgText;
        textSpan.style.cssText = "flex:1; min-width:0;";
        toast.appendChild(textSpan);

        var cartBtn = document.createElement("button");
        cartBtn.type = "button";
        cartBtn.innerText = "السلة 🛒";
        cartBtn.style.cssText = "background:#16a34a; color:#ffffff; border:none; padding:5px 10px; border-radius:8px; font-size:11px; font-weight:800; cursor:pointer; white-space:nowrap; flex-shrink:0;";
        cartBtn.onclick = function() {
            toast.remove();
            openCartPage();
        };
        toast.appendChild(cartBtn);

        document.body.appendChild(toast);

        addCartToastTimer = setTimeout(function() {
            if (toast && toast.parentNode) toast.remove();
        }, 6000);
    }

    function changeQty(id, delta) {
        var key = String(id);
        var baseId = getBaseProductIdFromCartKey(key);
        var p = getProductById(baseId);
        if (delta > 0 && (isProductOutOfStock(p) || isAllVariantsOutOfStock(p))) {
            alert('عذراً، نفذت كمية هذا المنتج حالياً.');
            return;
        }
        var currentQty = cart[key] || 0;
        var newQty = currentQty + delta;

        if (newQty <= 0) {
            delete cart[key];
        } else {
            cart[key] = newQty;
        }

        saveCartToStorage();

        renderProducts();
        
        if (!document.getElementById('productDetailPage').classList.contains('hidden') && currentDetailId == baseId) {
            renderDetailQtyControls(baseId);
        }

        if (!document.getElementById('cartPage').classList.contains('hidden')) {
            renderCartItems();
        } else if (delta > 0) {
            showAddToCartToast(p, key);
        }
    }

    function updateBadge() {
        var totalItems = 0;
        for (var id in cart) { totalItems += cart[id]; }
        document.getElementById('cartBadgeCount').innerText = totalItems;
    }

    function openCartPage() {
        hideSearchBox();
        document.getElementById('shopPage').classList.add('hidden');
        document.getElementById('productDetailPage').classList.add('hidden');
        document.getElementById('cartPage').classList.remove('hidden');
        window.scrollTo(0, 0);

        document.getElementById('custName').value = localStorage.getItem('cust_name') || '';
        document.getElementById('custPhone').value = localStorage.getItem('cust_phone') || '';
        document.getElementById('custAddress').value = localStorage.getItem('cust_address') || '';

        fetchCouponsFromSheet();
        renderCartItems();
    }

    function openShopPage() {
        hideSearchBox();
        document.getElementById('cartPage').classList.add('hidden');
        document.getElementById('productDetailPage').classList.add('hidden');
        document.getElementById('shopPage').classList.remove('hidden');
        renderProducts();
        initSlideshow();
        window.scrollTo(0, 0);
    }

    function renderCartItems() {
        var listContainer = document.getElementById('cartItemsList');
        var html = "";
        var subTotal = 0;
        var itemCount = 0;

        for (var id in cart) {
            var qty = cart[id];
            var baseId = getBaseProductIdFromCartKey(id);
            var p = getProductById(baseId);
            if (p) {
                itemCount++;
                var unitPrice = getCartItemUnitPrice(p, id);
                var variantText = getVariantTextFromCartKey(id);
                var itemTotal = unitPrice * qty;
                subTotal += itemTotal;
                var safeKeyAttr = escapeStoreHtml(JSON.stringify(String(id)));
                var variantBadgeHtml = variantText ? '<div class="cart-item-variant">🎛️ ' + escapeStoreHtml(variantText) + '</div>' : '';

                html += '<div class="cart-item">' +
                    '<div>' +
                        '<div class="cart-item-title">' + p.name + '</div>' +
                        variantBadgeHtml +
                        '<div class="cart-item-price">' + unitPrice.toLocaleString() + ' د.ع × ' + qty + ' = ' + itemTotal.toLocaleString() + ' د.ع</div>' +
                    '</div>' +
                    '<div class="qty-controls">' +
                        '<button class="btn-qty btn-minus" onclick="changeQty(' + safeKeyAttr + ', -1)">-</button>' +
                        '<span class="qty-number">' + qty + '</span>' +
                        '<button class="btn-qty btn-plus" style="width:30px;" onclick="changeQty(' + safeKeyAttr + ', 1)">+</button>' +
                    '</div>' +
                '</div>';
            }
        }

        if (itemCount === 0) {
            listContainer.innerHTML = '<div style="text-align:center; padding:30px;"><p style="color:#64748b; margin-bottom:15px;">السلة فارغة حالياً</p><button onclick="openShopPage()" style="background: #0f172a; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer;">تصفح المتجر</button></div>';
            document.getElementById('cartSummarySection').style.display = 'none';
            appliedCoupon = null;
            var couponInput = document.getElementById("couponInput");
            if (couponInput) couponInput.value = "";
            var couponStatusMsg = document.getElementById("couponStatusMsg");
            if (couponStatusMsg) couponStatusMsg.style.display = "none";
        } else {
            listContainer.innerHTML = html;
            document.getElementById('cartSummarySection').style.display = 'block';

            var discountAmount = 0;
            if (appliedCoupon && appliedCoupon.discount) {
                if (appliedCoupon.minAmount !== undefined && appliedCoupon.minAmount !== null && appliedCoupon.minAmount !== "" && !isNaN(Number(appliedCoupon.minAmount))) {
                    if (subTotal < Number(appliedCoupon.minAmount)) {
                        var minAmtVal = Number(appliedCoupon.minAmount);
                        appliedCoupon = null;
                        var couponInput = document.getElementById("couponInput");
                        if (couponInput) couponInput.value = "";
                        var couponStatusMsg = document.getElementById("couponStatusMsg");
                        if (couponStatusMsg) {
                            couponStatusMsg.style.display = "block";
                            couponStatusMsg.style.color = "#ef4444";
                            couponStatusMsg.innerText = "❌ تم إلغاء كود الخصم لعدم الوصول إلى الحد الأدنى للمبلغ (" + minAmtVal.toLocaleString() + " د.ع)";
                        }
                    }
                }

                if (appliedCoupon && appliedCoupon.discount) {
                    discountAmount = Math.round((subTotal * appliedCoupon.discount) / 100);
                }
            }

            var regionSelect = document.getElementById("regionSelect");
            var deliveryFee = 0;
            if (regionSelect && regionSelect.selectedIndex > 0) {
                deliveryFee = Number(regionSelect.options[regionSelect.selectedIndex].getAttribute("data-price")) || 0;
            }

            var finalTotal = subTotal - discountAmount + deliveryFee;

            var totalBox = document.getElementById('cartGrandTotalBox');
            if (totalBox) {
                var htmlContent = '<span>المبلغ الإجمالي:</span><div style="text-align:left;">';
                
                if (discountAmount > 0) {
                    htmlContent += '<span style="text-decoration:line-through; color:#94a3b8; font-size:12px; margin-left:6px;">' + subTotal.toLocaleString() + ' د.ع</span>';
                }
                
                htmlContent += '<span style="color:#16a34a; font-size: 16px;">' + finalTotal.toLocaleString() + ' د.ع</span>';
                
                if (discountAmount > 0) {
                    htmlContent += '<div style="font-size:11px; color:#16a34a; font-weight:normal;">(خصم ' + appliedCoupon.discount + '%: -' + discountAmount.toLocaleString() + ' د.ع)</div>';
                }
                if (deliveryFee > 0) {
                    htmlContent += '<div style="font-size:11px; color:#0f172a; font-weight:bold;">(متضمن أجور التوصيل: +' + deliveryFee.toLocaleString() + ' د.ع)</div>';
                }
                
                htmlContent += '</div>';
                totalBox.innerHTML = htmlContent;
            }
        }
    }

    function getProductById(id) {
        for (var i = 0; i < products.length; i++) {
            if (products[i].id == id) return products[i];
        }
        return null;
    }

    function sendOrderToWhatsApp() {
        var name = document.getElementById('custName').value.trim();
        var phone = document.getElementById('custPhone').value.trim();
        var address = document.getElementById('custAddress').value.trim();

        var regionSelect = document.getElementById("regionSelect");
        if (!regionSelect || regionSelect.value === "") {
            alert('يرجى اختيار المحافظة / المنطقة أولاً لتحديد أجرة التوصيل');
            return;
        }
        var deliveryFee = Number(regionSelect.options[regionSelect.selectedIndex].getAttribute("data-price")) || 0;
        var regionName = regionSelect.value;

        if (Object.keys(cart).length === 0) {
            alert('السلة فارغة!');
            return;
        }
        if (!name || !phone || !address) {
            alert('يرجى ملء جميع الحقول المطلوبة');
            return;
        }

        localStorage.setItem('cust_name', name);
        localStorage.setItem('cust_phone', phone);
        localStorage.setItem('cust_address', address);

        var itemsSummary = "";
        var subTotal = 0;
        for (var id in cart) {
            var baseId = getBaseProductIdFromCartKey(id);
            var p = getProductById(baseId);
            if (p) {
                var unitPrice = getCartItemUnitPrice(p, id);
                var variantText = getVariantTextFromCartKey(id);
                var itemTotal = unitPrice * cart[id];
                subTotal += itemTotal;
                if (variantText) {
                    itemsSummary += p.name + " (" + variantText + " - " + cart[id] + "x), ";
                } else {
                    itemsSummary += p.name + " (" + cart[id] + "x), ";
                }
            }
        }
        if (itemsSummary.endsWith(", ")) {
            itemsSummary = itemsSummary.slice(0, -2);
        }

        var discountVal = (appliedCoupon && appliedCoupon.discount) ? appliedCoupon.discount + "%" : "0%";
        var discountAmount = 0;
        if (appliedCoupon && appliedCoupon.discount) {
            discountAmount = Math.round((subTotal * appliedCoupon.discount) / 100);
        }
        
        var finalTotal = subTotal - discountAmount + deliveryFee;
        var fullAddress = address + " (المنطقة: " + regionName + " - توصيل: " + deliveryFee + " د.ع)";
        var invoiceNo = "INV-" + Math.floor(100000 + Math.random() * 900000);

        fetch(SHEET_API_URL, {
            method: "POST",
            body: JSON.stringify({
                action: "recordOrder",
                invoiceNo: invoiceNo,
                name: name,
                phone: phone,
                address: fullAddress,
                items: itemsSummary,
                discount: discountVal,
                total: finalTotal
            })
        }).catch(function(err) { console.log(err); });

        if (appliedCoupon) {
            var couponUses = JSON.parse(localStorage.getItem('coupon_uses') || '{}');
            couponUses[appliedCoupon.code] = (couponUses[appliedCoupon.code] || 0) + 1;
            localStorage.setItem('coupon_uses', JSON.stringify(couponUses));
        }

        cart = {};
        saveCartToStorage();
        updateBadge();

        appliedCoupon = null;
        var couponInput = document.getElementById("couponInput");
        if (couponInput) couponInput.value = "";
        var couponStatusMsg = document.getElementById("couponStatusMsg");
        if (couponStatusMsg) couponStatusMsg.style.display = "none";

        renderCartItems();

        var msg = "مرحباً متجر كوزمتك 🛍️\n";
        msg += "لقد قمت بإتمام طلب جديد بنجاح.\n";
        msg += "رقم الفاتورة الخاص بي هو: *" + invoiceNo + "*\n";
        msg += "يرجى متابعة الطلب. شكراً لكم! 🙏";

        window.open("https://wa.me/" + PHARMACY_WA + "?text=" + encodeURIComponent(msg), '_blank');
    }

    loadCartFromStorage();
    initStoreData();
    fetchCouponsFromSheet();
</script>
<script>
(function() {
    var isStorePopState = false;
    var storeExitConfirmPending = false;

    function showStoreBackToast(text) {
        var existing = document.getElementById("storeBackToast");
        if (existing) existing.remove();

        var toast = document.createElement("div");
        toast.id = "storeBackToast";
        toast.innerText = text;
        toast.style.cssText = "position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:rgba(15,23,42,0.95); color:#fff; padding:10px 18px; border-radius:25px; font-size:13px; font-weight:700; z-index:999999; box-shadow:0 4px 15px rgba(0,0,0,0.25); white-space:nowrap;";
        document.body.appendChild(toast);

        setTimeout(function() {
            if (toast && toast.parentNode) toast.remove();
        }, 2000);
    }

    function isSameStoreState(a, b) {
        if (!a || !b) return false;
        return a.storeView === b.storeView &&
               a.productId === b.productId &&
               a.category === b.category &&
               a.brand === b.brand;
    }

    function pushStoreState(stateObj) {
        if (isStorePopState) return;
        if (isSameStoreState(history.state, stateObj)) return;

        if (history.state && history.state.storeView === "search" && stateObj.storeView !== "search") {
            history.replaceState(stateObj, "");
        } else {
            history.pushState(stateObj, "");
        }
    }

    history.replaceState({ storeView: "root" }, "");
    history.pushState({ storeView: "home" }, "");

    var origOpenProductDetail = window.openProductDetail;
    window.openProductDetail = function(id) {
        if (typeof origOpenProductDetail === "function") origOpenProductDetail(id);
        pushStoreState({ storeView: "detail", productId: id });
    };

    var origOpenCartPage = window.openCartPage;
    window.openCartPage = function() {
        if (typeof origOpenCartPage === "function") origOpenCartPage();
        pushStoreState({ storeView: "cart" });
    };

    var origOpenShopPage = window.openShopPage;
    window.openShopPage = function() {
        if (typeof origOpenShopPage === "function") origOpenShopPage();
        if (activeCategory !== "الرئيسية" || activeBrand) {
            pushStoreState({ storeView: "filter", category: activeCategory, brand: activeBrand });
        } else {
            pushStoreState({ storeView: "home" });
        }
    };

    var origSelectCategory = window.selectCategory;
    window.selectCategory = function(cat) {
        if (typeof origSelectCategory === "function") origSelectCategory(cat);
        if (cat === "الرئيسية") {
            pushStoreState({ storeView: "home" });
        } else {
            pushStoreState({ storeView: "filter", category: cat, brand: null });
        }
    };

    var origFilterByBrand = window.filterByBrand;
    window.filterByBrand = function(brandName) {
        if (typeof origFilterByBrand === "function") origFilterByBrand(brandName);
        pushStoreState({ storeView: "filter", category: "الرئيسية", brand: brandName });
    };

    var origResetToHome = window.resetToHome;
    window.resetToHome = function() {
        if (typeof origResetToHome === "function") origResetToHome();
        pushStoreState({ storeView: "home" });
    };

    var origToggleSearchBox = window.toggleSearchBox;
    window.toggleSearchBox = function() {
        if (typeof origToggleSearchBox === "function") origToggleSearchBox();
        var box = document.getElementById("searchContainerBox");
        if (box && !box.classList.contains("hidden")) {
            pushStoreState({ storeView: "search" });
        }
    };

    var origHideSearchBox = window.hideSearchBox;
    window.hideSearchBox = function() {
        if (typeof origHideSearchBox === "function") origHideSearchBox();
        if (!isStorePopState && history.state && history.state.storeView === "search") {
            if (activeCategory !== "الرئيسية" || activeBrand) {
                history.replaceState({ storeView: "filter", category: activeCategory, brand: activeBrand }, "");
            } else {
                history.replaceState({ storeView: "home" }, "");
            }
        }
    };

    window.addEventListener("popstate", function(event) {
        var state = event.state;
        isStorePopState = true;

        if (state && state.storeView === "detail") {
            if (typeof origOpenProductDetail === "function") origOpenProductDetail(state.productId);
            isStorePopState = false;
            return;
        }

        if (state && state.storeView === "cart") {
            if (typeof origOpenCartPage === "function") origOpenCartPage();
            isStorePopState = false;
            return;
        }

        if (state && state.storeView === "filter") {
            document.getElementById("cartPage").classList.add("hidden");
            document.getElementById("productDetailPage").classList.add("hidden");
            document.getElementById("shopPage").classList.remove("hidden");
            if (state.brand) {
                if (typeof origFilterByBrand === "function") origFilterByBrand(state.brand);
            } else {
                var input = document.getElementById("searchInput");
                if (input) input.value = "";
                if (typeof origHideSearchBox === "function") origHideSearchBox();
                if (typeof origSelectCategory === "function") origSelectCategory(state.category || "الرئيسية");
            }
            isStorePopState = false;
            return;
        }

        if (state && state.storeView === "home") {
            var searchInput = document.getElementById("searchInput");
            if (searchInput) searchInput.value = "";
            if (typeof origHideSearchBox === "function") origHideSearchBox();
            if (activeCategory !== "الرئيسية" || activeBrand || searchQuery !== "") {
                if (typeof origResetToHome === "function") origResetToHome();
            } else {
                if (typeof origOpenShopPage === "function") origOpenShopPage();
            }
            isStorePopState = false;
            return;
        }

        var isSubPageOpen = !document.getElementById("productDetailPage").classList.contains("hidden") ||
                            !document.getElementById("cartPage").classList.contains("hidden");
        var searchBox = document.getElementById("searchContainerBox");
        var isSearchOpen = searchBox && !searchBox.classList.contains("hidden");

        if (isSubPageOpen || isSearchOpen || activeCategory !== "الرئيسية" || activeBrand || searchQuery !== "") {
            var inp = document.getElementById("searchInput");
            if (inp) inp.value = "";
            if (typeof origHideSearchBox === "function") origHideSearchBox();
            if (typeof origResetToHome === "function") origResetToHome();
            if (typeof origOpenShopPage === "function") origOpenShopPage();
            isStorePopState = false;
            history.pushState({ storeView: "home" }, "");
            return;
        }

        isStorePopState = false;
        if (!storeExitConfirmPending) {
            storeExitConfirmPending = true;
            showStoreBackToast("اضغط زر الرجوع مرة أخرى للخروج من المتجر");
            history.pushState({ storeView: "home" }, "");
            setTimeout(function() { storeExitConfirmPending = false; }, 2000);
        } else {
            history.back();
        }
    });
})();
</script>
